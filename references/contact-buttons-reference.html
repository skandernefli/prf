<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact buttons</title>
<style>
  :root {
    --bg: #0d0d0d;
    --fg: #f0ece4;
    --accent: #ff3b12;
    --muted: rgba(240, 236, 228, 0.72);
    --font-display: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; border-radius: 0; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-display);
    padding: 48px 42px;
  }

  /* ---------- Contact list ---------- */
  .footer-list {
    list-style: none;
    margin: 40px 0 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    max-width: 960px;
  }

  .footer-item {
    display: flex;
    align-items: stretch;
    min-width: 0;
  }

  /* Main button = the link. Text inside stays selectable. */
  .footer-link {
    flex: 1 1 auto;
    min-width: 0;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 4px 16px;
    min-height: 72px;
    padding: 14px 18px;
    color: var(--fg);
    text-decoration: none;
    background: transparent;
    border: 2px solid var(--fg);
    transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease, color .12s ease;
  }

  .footer-label {
    grid-column: 1;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .footer-value {
    grid-column: 1;
    font-weight: 800;
    font-size: clamp(16px, 1.6vw, 20px);
    line-height: 1.2;
    letter-spacing: -.01em;
    overflow-wrap: anywhere;
    cursor: text;
    user-select: text;
    -webkit-user-select: text;
  }

  .footer-icon {
    grid-column: 2;
    grid-row: 1 / span 2;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 8px;
    color: var(--accent);
    border: 2px solid currentColor;
    transition: background-color .12s ease, color .12s ease, border-color .12s ease;
  }
  .footer-link:hover .footer-icon,
  .footer-link:focus-visible .footer-icon {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--bg);
  }
  .footer-icon svg,
  .icon-link svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: square;
    stroke-linejoin: miter;
  }

  /* Phone + WhatsApp share one rectangle */
  .footer-actions {
    grid-column: 2;
    grid-row: 1 / span 2;
    display: flex;
    gap: 8px;
  }
  .icon-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 8px;
    color: var(--accent);
    border: 2px solid currentColor;
    text-decoration: none;
    transition: background-color .12s ease, color .12s ease, border-color .12s ease;
  }
  .icon-link:hover {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--bg);
  }
  .icon-link:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  .footer-link:hover,
  .footer-link:focus-visible {
    background: var(--fg);
    color: var(--bg);
    transform: translate(-4px, -4px);
    box-shadow: 4px 4px 0 var(--accent);
  }
  .footer-link:hover .footer-label,
  .footer-link:focus-visible .footer-label { color: rgba(13, 13, 13, 0.75); }

  /* Copy button (keyboard / touch friendly alternative) */
  .copy-btn {
    flex: 0 0 auto;
    width: 84px;
    margin-left: -2px; /* shares the border with the main button */
    padding: 0;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--fg);
    background: transparent;
    border: 2px solid var(--fg);
    cursor: pointer;
    transition: background-color .12s ease, color .12s ease;
  }
  .copy-btn:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .copy-btn[data-copied="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  /* Visible focus for everything */
  .footer-link:focus-visible,
  .copy-btn:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 4px;
  }

  /* Status toast (also read by screen readers) */
  .footer-status {
    margin-top: 24px;
    min-height: 20px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  ::selection { background: var(--accent); color: var(--bg); }

  @media (max-width: 720px) {
    body { padding: 32px 20px; }
    .footer-list { grid-template-columns: 1fr; }
    .copy-btn { width: 72px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .footer-link:hover, .footer-link:focus-visible { transform: none; }
  }
</style>
</head>
<body>

<!-- Place this block directly under your "LET'S TALK." link -->
<section class="footer" aria-labelledby="footer-title">
  <h2 id="footer-title" style="position:absolute;left:-9999px;">Contact information</h2>

  <ul class="footer-list">
    <li class="footer-item">
      <a class="footer-link" href="mailto:skander.nefli@gmail.com" draggable="false" aria-label="Send an email to skander.nefli@gmail.com">
        <span class="footer-label">01 / Email</span>
        <span class="footer-value" data-copy="skander.nefli@gmail.com">skander.nefli@gmail.com</span>
        <span class="footer-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14"/><path d="M3 6l9 7 9-7"/></svg></span>
      </a>
      <button class="copy-btn" type="button" data-copy="skander.nefli@gmail.com" aria-label="Copy email address">Copy</button>
    </li>

    <li class="footer-item">
      <a class="footer-link" href="https://www.linkedin.com/in/skander-nefli/" target="_blank" rel="noopener noreferrer" draggable="false" aria-label="Open LinkedIn profile">
        <span class="footer-label">02 / LinkedIn</span>
        <span class="footer-value" data-copy="https://www.linkedin.com/in/skander-nefli/">linkedin.com/in/skander-nefli</span>
        <span class="footer-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g transform="translate(12 12) scale(1.3) translate(-12.75 -12)"><path vector-effect="non-scaling-stroke" d="M8 10v7M8 7h.01M12 17v-7M12 13c0-1.7 1.1-3 2.8-3s2.7 1.3 2.7 3v4"/></g></svg></span>
      </a>
      <button class="copy-btn" type="button" data-copy="https://www.linkedin.com/in/skander-nefli/" aria-label="Copy LinkedIn URL">Copy</button>
    </li>

    <li class="footer-item">
      <div class="footer-link">
        <span class="footer-label">03 / Phone &amp; WhatsApp</span>
        <span class="footer-value" data-copy="+216 2106799">+216 2106799</span>
        <span class="footer-actions">
          <a class="icon-link" href="tel:+2162106799" draggable="false" aria-label="Call +216 2106799"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></a>
          <a class="icon-link" href="https://wa.me/2162106799" target="_blank" rel="noopener noreferrer" draggable="false" aria-label="Message +216 2106799 on WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/></svg></a>
        </span>
      </div>
      <button class="copy-btn" type="button" data-copy="+216 2106799" aria-label="Copy phone number">Copy</button>
    </li>
  </ul>

  <p class="footer-status" role="status" aria-live="polite"></p>
</section>

<script>
(function () {
  var status = document.querySelector('.footer-status');
  var timer;

  function announce(msg) {
    status.textContent = msg;
    clearTimeout(timer);
    timer = setTimeout(function () { status.textContent = ''; }, 2000);
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy') ? resolve() : reject(); }
      catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }

  // 1) Copy buttons
  document.querySelectorAll('.copy-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      copyText(btn.dataset.copy).then(function () {
        btn.dataset.copied = 'true';
        btn.textContent = 'Copied';
        announce('Copied: ' + btn.dataset.copy);
        setTimeout(function () { btn.dataset.copied = 'false'; btn.textContent = 'Copy'; }, 1500);
      }).catch(function () { announce('Copy failed'); });
    });
  });

  // 2) Selecting the text auto-copies it
  document.querySelectorAll('.footer-value').forEach(function (el) {
    el.addEventListener('mouseup', function () { handleSelection(el); });
    el.addEventListener('touchend', function () { setTimeout(function () { handleSelection(el); }, 50); });
  });

  function handleSelection(el) {
    var sel = window.getSelection();
    var picked = sel ? sel.toString().trim() : '';
    if (!picked || !el.contains(sel.anchorNode)) return;
    var text = picked === el.textContent.trim() ? el.dataset.copy : picked;
    copyText(text).then(function () { announce('Copied: ' + text); }).catch(function () {});
  }

  // 3) A click that ends a text selection must NOT open the link
  document.querySelectorAll('a.footer-link').forEach(function (link) {
    link.addEventListener('click', function (e) {
      var sel = window.getSelection();
      if (sel && sel.toString().trim() !== '') {
        e.preventDefault();
      }
    });
  });
})();
</script>
</body>
</html>
